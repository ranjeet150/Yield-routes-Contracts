[workspace]
resolver = "2"
members = [
  "contracts/route_aggregator",
  "contracts/yield_vault",
  "contracts/fee_distributor",
  "contracts/price_oracle",
]
[workspace.dependencies]
soroban-sdk = { version = "21.7.6", features = ["testutils"] }

[profile.release]
opt-level = "z"; overflow-checks = true; debug = 0; strip = "symbols"
debug-assertions = false; panic = "abort"; codegen-units = 1; lto = true
