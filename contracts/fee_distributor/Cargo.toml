[package]
name = "fee-distributor"
version = "0.1.0"
edition = "2021"
description = "Protocol fee splitter for YieldRoutes (treasury/vault/LP rewards)"
license = "Apache-2.0"
repository = "https://github.com/YOUR_ORG/yield-routes-contracts"
[lib]
crate-type = ["cdylib"]
[dependencies]
soroban-sdk = { workspace = true }
[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
[features]
testutils = ["soroban-sdk/testutils"]
