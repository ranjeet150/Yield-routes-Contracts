[package]
name = "route-aggregator"
version = "0.1.0"
edition = "2021"
description = "Soroban DEX route aggregator across registered AMM pools"
license = "Apache-2.0"
repository = "https://github.com/YOUR_ORG/yield-routes-contracts"
[lib]
crate-type = ["cdylib"]
[dependencies]
soroban-sdk = { workspace = true }
[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
[features]
testutils = ["soroban-sdk/testutils"]
